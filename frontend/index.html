<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrialMatch — Clinical Trial Eligibility Engine</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ── CSS Custom Properties ── */
      :root {
        --bg:           #F4F6FA;
        --surface:      #FFFFFF;
        --surface-2:    #F0F3F8;
        --border:       #DDE3EE;
        --border-soft:  #EEF1F7;
        --primary:      #0B3D8C;
        --primary-mid:  #1557C0;
        --primary-light:#EBF1FB;
        --accent:       #0E9EA0;
        --accent-light: #E4F6F6;
        --text:         #0D1829;
        --text-mid:     #374151;
        --text-muted:   #6B7280;
        --text-hint:    #9CA3AF;
        --eligible:     #059669;
        --eligible-bg:  #ECFDF5;
        --eligible-border: #A7F3D0;
        --ineligible:   #DC2626;
        --ineligible-bg:#FEF2F2;
        --ineligible-border: #FECACA;
        --uncertain:    #D97706;
        --uncertain-bg: #FFFBEB;
        --uncertain-border: #FDE68A;
        --font-display: 'Crimson Pro', Georgia, serif;
        --font-body:    'DM Sans', system-ui, sans-serif;
        --font-mono:    'JetBrains Mono', monospace;
        --radius:       10px;
        --shadow-sm:    0 1px 3px rgba(11,61,140,0.06), 0 1px 2px rgba(11,61,140,0.04);
        --shadow-md:    0 4px 12px rgba(11,61,140,0.08), 0 2px 4px rgba(11,61,140,0.04);
        --shadow-lg:    0 12px 32px rgba(11,61,140,0.10), 0 4px 8px rgba(11,61,140,0.05);
      }

      /* ── Base ── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html { font-size: 16px; -webkit-font-smoothing: antialiased; }

      body {
        font-family: var(--font-body);
        background-color: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }

      /* ── Dot-grid background ── */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image: radial-gradient(circle, #CBD5E1 1px, transparent 1px);
        background-size: 28px 28px;
        opacity: 0.35;
        pointer-events: none;
        z-index: 0;
      }

      #root { position: relative; z-index: 1; }

      /* ── Typography ── */
      .font-display { font-family: var(--font-display); }
      .font-mono    { font-family: var(--font-mono); }

      /* ── Custom scrollbar ── */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #B0BAD0; }

      /* ── Animations ── */
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes pulse-ring {
        0%   { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(14,158,160,0.4); }
        70%  { transform: scale(1);    box-shadow: 0 0 0 10px rgba(14,158,160,0); }
        100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(14,158,160,0); }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes score-arc {
        from { stroke-dashoffset: 314; }
      }
      @keyframes shimmer {
        0%   { background-position: -200% 0; }
        100% { background-position:  200% 0; }
      }

      .animate-fade-up    { animation: fadeUp 0.45s ease both; }
      .animate-fade-in    { animation: fadeIn 0.3s ease both; }
      .animate-spin-slow  { animation: spin 1.2s linear infinite; }
      .animate-pulse-ring { animation: pulse-ring 2s ease infinite; }

      /* Staggered children */
      .stagger > *:nth-child(1)  { animation-delay: 0ms; }
      .stagger > *:nth-child(2)  { animation-delay: 60ms; }
      .stagger > *:nth-child(3)  { animation-delay: 120ms; }
      .stagger > *:nth-child(4)  { animation-delay: 180ms; }
      .stagger > *:nth-child(5)  { animation-delay: 240ms; }
      .stagger > *:nth-child(6)  { animation-delay: 300ms; }
      .stagger > *:nth-child(7)  { animation-delay: 360ms; }
      .stagger > *:nth-child(8)  { animation-delay: 420ms; }
      .stagger > *:nth-child(9)  { animation-delay: 480ms; }
      .stagger > *:nth-child(10) { animation-delay: 540ms; }

      /* ── Card base ── */
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
      }
      .card-elevated {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-md);
      }

      /* ── Buttons ── */
      .btn-primary {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 11px 22px;
        background: var(--primary);
        color: #fff;
        font-family: var(--font-body);
        font-size: 14px;
        font-weight: 500;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
        box-shadow: 0 1px 3px rgba(11,61,140,0.3);
        letter-spacing: 0.01em;
      }
      .btn-primary:hover:not(:disabled) {
        background: var(--primary-mid);
        box-shadow: 0 3px 10px rgba(11,61,140,0.3);
        transform: translateY(-1px);
      }
      .btn-primary:active:not(:disabled) { transform: translateY(0); }
      .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

      .btn-secondary {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 10px 18px;
        background: var(--surface);
        color: var(--text-mid);
        font-family: var(--font-body);
        font-size: 14px;
        font-weight: 500;
        border: 1px solid var(--border);
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s, transform 0.1s;
      }
      .btn-secondary:hover { background: var(--surface-2); border-color: #C4CEDF; transform: translateY(-1px); }

      .btn-ghost {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 8px 12px;
        background: transparent;
        color: var(--text-muted);
        font-family: var(--font-body);
        font-size: 13px;
        font-weight: 500;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
      }
      .btn-ghost:hover { background: var(--surface-2); color: var(--text-mid); }

      /* ── Form controls ── */
      textarea, input[type="text"] {
        font-family: var(--font-body);
        font-size: 14px;
        color: var(--text);
        background: var(--surface);
        border: 1.5px solid var(--border);
        border-radius: 8px;
        padding: 12px 14px;
        width: 100%;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
        resize: vertical;
        line-height: 1.6;
      }
      textarea:focus, input[type="text"]:focus {
        border-color: var(--primary-mid);
        box-shadow: 0 0 0 3px rgba(21,87,192,0.10);
      }

      /* ── Verdict badges ── */
      .badge {
        display: inline-flex; align-items: center; gap: 5px;
        padding: 3px 10px;
        border-radius: 99px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-family: var(--font-body);
        white-space: nowrap;
      }
      .badge-eligible   { background: var(--eligible-bg);   color: var(--eligible);   border: 1px solid var(--eligible-border); }
      .badge-ineligible { background: var(--ineligible-bg); color: var(--ineligible); border: 1px solid var(--ineligible-border); }
      .badge-uncertain  { background: var(--uncertain-bg);  color: var(--uncertain);  border: 1px solid var(--uncertain-border); }
      .badge-primary    { background: var(--primary-light); color: var(--primary);    border: 1px solid #C1D0F0; }
      .badge-neutral    { background: var(--surface-2);     color: var(--text-muted); border: 1px solid var(--border); }
      .badge-accent     { background: var(--accent-light);  color: var(--accent);     border: 1px solid #9FD8D9; }

      /* ── Step indicator ── */
      .step-dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: var(--border);
        transition: background 0.3s, transform 0.3s;
      }
      .step-dot.active  { background: var(--primary); transform: scale(1.3); }
      .step-dot.done    { background: var(--accent); }

      /* ── Score arc animation ── */
      .score-arc { animation: score-arc 1.2s ease both; }

      /* ── Skeleton shimmer ── */
      .shimmer {
        background: linear-gradient(90deg, var(--surface-2) 25%, #E8ECF4 50%, var(--surface-2) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
      }

      /* ── Criteria table ── */
      .criteria-row:nth-child(even) { background: var(--surface-2); }
      .criteria-row { border-bottom: 1px solid var(--border-soft); transition: background 0.1s; }
      .criteria-row:hover { background: var(--primary-light); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
